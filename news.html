<main id="display-news">


<script src="news.js"></script>

<div id="news-list"></div>

<div id="news-pagination"></div>

<script>
  const newsPerPage = 50;
  let currentPage = 1;

  // 日付の新しい順に並べる
  const sortedNews = [...newsList].sort(
    (a, b) => new Date(b.date) - new Date(a.date)
  );

  function displayNews(page) {
    const container = document.getElementById("news-list");
    const pagination = document.getElementById("news-pagination");

    // ニュース一覧を空にする
    container.innerHTML = "";

    // 現在のページに表示するニュースを取得
    const start = (page - 1) * newsPerPage;
    const end = start + newsPerPage;
    const pageNews = sortedNews.slice(start, end);

    // ニュースを表示
    pageNews.forEach(news => {
      const div = document.createElement("div");
      div.classList.add("news-list");

      if (news.link) {
        div.innerHTML = `
          <a href="${news.link}" target="_blank" rel="noopener noreferrer" class="news-link">
            <span class="news-date">${news.date}<br></span>
            <span class="news-title">${news.title}</span>
          </a>
        `;
      } else {
        div.innerHTML = `
          <span class="news-no-link">
            <span class="news-date">${news.date}<br></span>
            <span class="news-title">${news.title}</span>
          </span>
        `;
      }

      container.appendChild(div);
    });

    // ページ数
    const totalPages = Math.ceil(sortedNews.length / newsPerPage);

    pagination.innerHTML = "";

    // 1ページしかない場合はページネーションを表示しない
    if (totalPages <= 1) {
      return;
    }

    // 「前へ」
    if (page > 1) {
      const prev = document.createElement("button");
      prev.textContent = "前へ";
      prev.addEventListener("click", () => {
        currentPage--;
        displayNews(currentPage);
        window.scrollTo(0, 0);
      });

      pagination.appendChild(prev);
    }

    // ページ番号
    for (let i = 1; i <= totalPages; i++) {
      const pageButton = document.createElement("button");
      pageButton.textContent = i;

      if (i === page) {
        pageButton.disabled = true;
      }

      pageButton.addEventListener("click", () => {
        currentPage = i;
        displayNews(currentPage);
        window.scrollTo(0, 0);
      });

      pagination.appendChild(pageButton);
    }

    // 「次へ」
    if (page < totalPages) {
      const next = document.createElement("button");
      next.textContent = "次へ";
      next.addEventListener("click", () => {
        currentPage++;
        displayNews(currentPage);
        window.scrollTo(0, 0);
      });

      pagination.appendChild(next);
    }
  }

  // 最初のページを表示
  displayNews(currentPage);
</script>
